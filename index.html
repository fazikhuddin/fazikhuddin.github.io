<style>
:root{
  --c1:#003B46;--c2:#07575B;--c3:#66A5AD;--c4:#C4DFE6;
  --bg:#f3f8fa;--bg2:#e6f1f4;--card:#ffffff;--ink:#062a31;--mut:#4d6d73;--line:#d3e6eb;
  --acc:var(--c2);--glass:rgba(255,255,255,.72);--shadow:0 18px 40px -18px rgba(0,59,70,.35);
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1)
}
body.dark{--bg:#021f25;--bg2:#03272e;--card:#06323a;--ink:#e3f2f5;--mut:#9cc3ca;--line:#0d4852;--acc:var(--c3);--glass:rgba(3,39,46,.72);--shadow:0 18px 40px -18px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
::selection{background:var(--c3);color:#fff}

/* ---------- scroll progress */
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--c3),var(--c4));z-index:60}

/* ---------- header */
header.top{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:18px;height:70px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff;box-shadow:0 4px 14px -4px rgba(0,59,70,.5);transition:transform .5s var(--ease)}
.logo:hover img{transform:rotateY(180deg) scale(1.05)}
.logo b{display:block;font-size:19px;letter-spacing:.06em;font-weight:800;color:var(--ink);line-height:1}
.logo small{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--mut);font-weight:700;margin-top:3px}
nav.menu{display:flex;gap:2px;margin-left:auto}
nav.menu a{position:relative;padding:9px 13px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--mut);transition:color .2s}
nav.menu a::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:2px;border-radius:2px;background:var(--c3);transform:scaleX(0);transition:transform .3s var(--ease)}
nav.menu a:hover,nav.menu a.on{color:var(--ink)}nav.menu a:hover::after,nav.menu a.on::after{transform:scaleX(1)}

/* ---------- toggles (switch-style buttons) */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;isolation:isolate}
.seg button{position:relative;z-index:2;border:0;background:none;color:var(--mut);font:700 13px/1 inherit;font-family:inherit;padding:9px 14px;border-radius:999px;cursor:pointer;transition:color .3s;white-space:nowrap}
.seg button[aria-pressed=true]{color:#fff}
.seg .thumb{position:absolute;z-index:1;top:4px;bottom:4px;left:4px;border-radius:999px;background:linear-gradient(135deg,var(--c2),var(--c1));box-shadow:0 6px 16px -6px rgba(0,59,70,.7);transition:transform .45s var(--ease),width .45s var(--ease)}
.seg.big button{font-size:15.5px;padding:14px 26px}
.seg.big{padding:6px}.seg.big .thumb{top:6px;bottom:6px;left:6px}
.sw{position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;padding:0;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffd27a,#ff9f43);display:grid;place-items:center;font-style:normal;font-size:14px;transition:transform .45s var(--ease),background .45s}
body.dark .sw i{transform:translateX(28px);background:linear-gradient(135deg,var(--c4),var(--c3))}
#burger{display:none}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}

/* ---------- intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;perspective:900px;overflow:hidden;animation:autohide .6s 4.2s forwards;cursor:pointer}
@keyframes autohide{to{opacity:0;visibility:hidden;pointer-events:none}}
#intro .bgi{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--c2),var(--c1) 70%);transition:opacity .8s}
#intro .ring{position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(196,223,230,.35);animation:ring 2.4s var(--ease) infinite}
#intro .ring:nth-child(3){animation-delay:.6s}#intro .ring:nth-child(4){animation-delay:1.2s}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}
#ilogo{width:210px;height:210px;border-radius:44px;background:#fff;object-fit:cover;box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 8px rgba(196,223,230,.25);animation:spin3d 1.6s var(--ease) both;will-change:transform}
@keyframes spin3d{0%{transform:rotateY(-540deg) rotateX(30deg) scale(.2);opacity:0}60%{opacity:1}100%{transform:rotateY(0) rotateX(0) scale(1)}}
#intro .it{position:absolute;top:calc(50% + 140px);text-align:center;color:#fff;width:100%}
#intro .it b{display:block;font-size:40px;letter-spacing:.32em;font-weight:800;opacity:0;animation:up .8s .9s var(--ease) forwards}
#intro .it em{display:block;font-style:normal;letter-spacing:.36em;font-size:11px;color:rgba(196,223,230,.7);font-weight:700;margin-top:8px;opacity:0;animation:up .8s 1.35s var(--ease) forwards}
#intro .it span{display:block;letter-spacing:.42em;font-size:13px;color:var(--c4);font-weight:700;opacity:0;animation:up .8s 1.15s var(--ease) forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#intro.out{animation:fadeout .7s .25s forwards}
@keyframes fadeout{to{opacity:0;visibility:hidden}}

/* ---------- hero */
.hero{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;min-height:calc(100vh - 70px);padding:30px 0 40px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--c2);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
body.dark .eyebrow{color:var(--c4)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c3);box-shadow:0 0 0 4px rgba(102,165,173,.25);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(102,165,173,0)}}
.hero h1{font-size:clamp(46px,7.5vw,92px);line-height:.95;margin:22px 0 6px;font-weight:900;letter-spacing:.02em;background:linear-gradient(120deg,var(--c1),var(--c2) 45%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}

.hero .tag{font-size:clamp(15px,2vw,20px);letter-spacing:.34em;font-weight:800;color:var(--c3);margin:0 0 22px}
.words{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.words span{font-size:clamp(17px,2.2vw,23px);font-weight:700;padding:6px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;transform:translateY(20px) rotateX(-60deg);animation:word .8s var(--ease) forwards}
.words span:nth-child(1){animation-delay:.2s;color:var(--c1)}.words span:nth-child(2){animation-delay:.4s;color:var(--c2)}.words span:nth-child(3){animation-delay:.6s;color:#2f7f87}.words span:nth-child(4){animation-delay:.8s;color:var(--c2)}

@keyframes word{to{opacity:1;transform:none}}
.hero p.lead{color:var(--mut);font-size:17.5px;max-width:560px;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:12px;text-decoration:none;border-radius:999px;padding:6px 8px 6px 20px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s}
.pill i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--bg2);transition:transform .4s var(--ease),background .3s}
.pill:hover{transform:translateY(-3px)}.pill:hover i{transform:translateX(4px) rotate(-45deg);background:var(--c3);color:#fff}
.pill.main{background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;border-color:transparent}.pill.main i{background:rgba(255,255,255,.18)}
@keyframes float{50%{transform:translateY(-14px)}}
.scrollhint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:26px;height:42px;border:2px solid var(--c3);border-radius:14px}
.scrollhint::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--c3);animation:wheel 1.6s infinite}
@keyframes wheel{to{transform:translateY(14px);opacity:0}}

/* ---------- search */
.sbox{position:relative;max-width:560px;margin-bottom:26px}
.sbox input{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 18px 0 48px;font-size:15.5px;outline:none;box-shadow:var(--shadow);transition:border-color .2s}

.sbox::before{content:"⌕";position:absolute;left:17px;top:11px;font-size:24px;color:var(--c3)}
#sres{position:absolute;top:62px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:52vh;overflow:auto;z-index:20}
#sres:empty{display:none}#sres a{display:block;padding:10px 16px;border-bottom:1px solid var(--line);text-decoration:none}#sres a:hover{background:var(--bg2)}#sres small{display:block;color:var(--mut)}

/* ---------- sections */
section.blk{padding:90px 0 40px}
.sh{text-align:center;margin-bottom:34px}
.sh h2{font-size:clamp(30px,4.4vw,46px);margin:14px 0 8px;line-height:1.1}
.sh p{color:var(--mut);max-width:640px;margin:0 auto}
.switchrow{display:flex;justify-content:center;margin:0 0 34px}
.panel{display:none}.panel.on{display:block;animation:panel .6s var(--ease)}
@keyframes panel{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;perspective:1200px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .3s;will-change:transform;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(102,165,173,.22),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--c3),var(--c1));box-shadow:0 12px 24px -10px rgba(0,59,70,.7);transform:translateZ(40px)}
.card h3{margin:6px 0 0;font-size:19.5px;line-height:1.25;transform:translateZ(26px)}
.card p{margin:0;color:var(--mut);font-size:14.5px;transform:translateZ(14px)}
.card .bot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;transform:translateZ(20px)}
.badge{font-size:12px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--c2);border:1px solid var(--line)}
body.dark .badge{color:var(--c4)}
.badge.soon{color:#b4690e;background:#fff4e5;border-color:#f6dfbd}body.dark .badge.soon{background:#3a2a12;color:#ffc46b;border-color:#5a4420}
.go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);transition:transform .4s var(--ease),background .3s}
.card:hover .go{transform:rotate(-45deg);background:var(--c2);color:#fff}
.num{position:absolute;top:18px;right:20px;font-weight:900;font-size:44px;line-height:1;color:var(--bg2);transform:translateZ(10px)}
body.dark .num{color:#0b3e47}

/* ---------- feature (3D book) */
.feature{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:28px;padding:46px;overflow:hidden;position:relative}
.feature::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-160px;top:-200px;background:radial-gradient(circle,rgba(196,223,230,.25),transparent 60%)}
.book{perspective:1200px;display:grid;place-items:center;min-height:300px}
.book .b3{position:relative;width:200px;height:280px;transform-style:preserve-3d;transform:rotateY(-28deg) rotateX(8deg);animation:bk 7s ease-in-out infinite}
@keyframes bk{50%{transform:rotateY(-12deg) rotateX(2deg) translateY(-10px)}}
.b3 .fc{position:absolute;inset:0;border-radius:4px 10px 10px 4px;background:linear-gradient(160deg,#fff,var(--c4));color:var(--c1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:translateZ(18px);box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.4)}
.b3 .fc b{font-size:28px;letter-spacing:.06em}.b3 .fc span{font-size:11px;letter-spacing:.2em;font-weight:700}.b3 .fc small{font-size:11px;margin-top:30px}
.b3 .sp{position:absolute;top:0;bottom:0;left:0;width:36px;background:var(--c3);transform:rotateY(-90deg) translateZ(0);transform-origin:left}
.b3 .pg{position:absolute;inset:4px 0 4px 6px;background:repeating-linear-gradient(90deg,#f6f6f6 0 2px,#e2e2e2 2px 3px);transform:translateZ(-18px);border-radius:2px}
.b3 .pr{position:absolute;top:4px;bottom:4px;right:0;width:36px;background:repeating-linear-gradient(90deg,#fafafa 0 1px,#ddd 1px 2px);transform:rotateY(90deg) translateZ(-18px);transform-origin:right}
.feature h2{font-size:clamp(26px,3.4vw,38px);margin:12px 0 10px;line-height:1.15}
.feature p{opacity:.88;margin:0 0 20px}
.feature .eyebrow{background:rgba(255,255,255,.12);color:var(--c4);border-color:rgba(255,255,255,.2)}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 26px}.facts div b{display:block;font-size:30px}.facts div span{font-size:13px;opacity:.8}

/* ---------- inner pages */
.page{padding:40px 0 70px;min-height:70vh}
.crumb{font-size:14px;color:var(--mut);margin-bottom:16px}.crumb a{text-decoration:none;color:var(--c3);font-weight:600}
.phead{display:flex;gap:20px;align-items:center;margin-bottom:24px}
.phead .ic{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font-weight:900;font-size:24px;color:#fff;background:linear-gradient(135deg,var(--c3),var(--c1));flex:none;box-shadow:var(--shadow)}
.phead h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.15}
.topics{list-style:none;padding:0;display:grid;gap:12px;counter-reset:t}
.topics li{counter-increment:t}
.topics a,.topics div.x{display:flex;gap:16px;align-items:center;padding:16px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .3s var(--ease),border-color .3s}
.topics a:hover{transform:translateX(8px);border-color:var(--c3)}
.topics a::before,.topics div.x::before{content:counter(t,decimal-leading-zero);flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--bg2);color:var(--c2)}
body.dark .topics a::before{color:var(--c4)}
.topics small{display:block;color:var(--mut)}
.empty{padding:28px;border-radius:18px;border:1.5px dashed var(--line);color:var(--mut);background:var(--card)}
.about{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.photo3d{perspective:1000px}.photo3d img{width:100%;border-radius:24px;box-shadow:var(--shadow);transition:transform .3s ease-out;background:#fff}
.about h1{margin:0 0 6px;font-size:clamp(26px,3.6vw,38px);line-height:1.15}.role{color:var(--c3);font-weight:700;margin:0 0 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin-top:22px;padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.kv b{color:var(--mut)}

/* ---------- reveal */
.rv{opacity:0;transform:translateY(40px) scale(.98);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.l{transform:translateX(-50px)}.rv.r{transform:translateX(50px)}.rv.in.l,.rv.in.r{transform:none}

footer{margin-top:40px;background:var(--c1);color:var(--c4);padding:40px 0 30px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
footer .fb{display:flex;align-items:center;gap:14px}footer .fb img{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:cover}
footer .fb b{color:#fff;font-size:20px;letter-spacing:.08em;display:block}footer .fb span{font-size:11px;letter-spacing:.2em}
footer .au{color:#fff;font-weight:700}
footer small{display:block;opacity:.8}

@media(max-width:980px){.hero{grid-template-columns:1fr;min-height:auto;padding-top:40px}.stage{max-width:420px}.feature{grid-template-columns:1fr;padding:30px}.about{grid-template-columns:1fr}.photo3d{max-width:280px}}
@media(max-width:860px){nav.menu{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--card);border-bottom:1px solid var(--line);padding:10px}body.nav nav.menu{display:flex}#burger{display:block}.logo small{display:none}.seg.big button{padding:12px 16px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ---------- tagline (EN + local) */
.hero .tag{margin:0 0 4px}
.hero .tag2{font-size:12.5px;letter-spacing:.3em;font-weight:800;color:var(--mut);margin:0 0 20px;text-transform:uppercase}

/* ---------- space stage */
.hero{position:relative}
.stage{position:relative;aspect-ratio:1/1;max-width:580px;width:100%;justify-self:center;border-radius:30px;overflow:hidden;
  background:radial-gradient(120% 90% at 70% 10%,#0b5d63 0%,#003B46 45%,#001a20 100%);box-shadow:0 40px 80px -30px rgba(0,59,70,.75),inset 0 0 0 1px rgba(196,223,230,.12);transform-style:preserve-3d}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.stage .bg{position:absolute;inset:0;z-index:1;pointer-events:none}
#boy{position:absolute;left:2%;bottom:0;width:60%;z-index:2;cursor:pointer;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));transition:transform .4s var(--ease)}
#boy:hover{transform:translateY(-4px) scale(1.02)}
#boy .hand-l{animation:typeL .32s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
#boy .hand-r{animation:typeR .32s .16s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
body.fast #boy .hand-l,body.fast #boy .hand-r{animation-duration:.12s}
@keyframes typeL{to{transform:translateY(3px)}}@keyframes typeR{to{transform:translateY(3px)}}
#boy .head{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 90%;transform-box:fill-box}
@keyframes bob{50%{transform:rotate(-3deg) translateY(1px)}}

@keyframes codeScroll{from{transform:translateY(0)}to{transform:translateY(-36px)}}

#boy .steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
#boy .blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.hint{position:absolute;z-index:4;left:20%;bottom:58%;padding:8px 14px;border-radius:14px 14px 14px 4px;background:#fff;color:var(--c1);font:700 13px/1.2 inherit;font-family:inherit;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);animation:hintb 2.2s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes hintb{50%{transform:translateY(-6px)}}
.stage.on .hint{display:none}
.stagebadge{position:absolute;z-index:4;top:14px;left:14px;display:flex;gap:6px}
.stagebadge span{font:700 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--c4);background:rgba(0,0,0,.28);border:1px solid rgba(196,223,230,.2);padding:6px 9px;border-radius:999px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.stat b{font-size:20px;color:var(--c2)}body.dark .stat b{color:var(--c4)}

/* ---------- console */
#con{position:absolute;z-index:30;top:30px;bottom:40px;left:0;width:calc(52% - 10px);display:grid;grid-template-columns:1.15fr .85fr;border-radius:22px;overflow:hidden;
  background:#011a1f;border:1px solid rgba(102,165,173,.35);box-shadow:0 40px 90px -30px rgba(0,0,0,.8);color:#d8eef2;
  font:13.5px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;opacity:0;visibility:hidden;transform:translateX(60px) rotateY(-12deg);transform-origin:right center;transition:opacity .45s var(--ease),transform .55s var(--ease),visibility .45s}

#con .ref button:hover{background:rgba(102,165,173,.22);transform:translateX(3px)}

.bk{position:relative;display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;padding:28px;border-radius:26px;text-decoration:none;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:var(--shadow);transition:transform .3s var(--ease)}

.lessons li{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s}
.lessons li:hover{transform:translateX(6px);border-color:var(--c3)}
.ln{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--bg2);color:var(--c2)}
body.dark .ln{color:var(--c4)}
.lt{flex:1;min-width:0}.lt b{display:block;line-height:1.35}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fgrp{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.ft{font:800 11px/1 ui-monospace,Consolas,monospace;padding:6px 8px;border-radius:8px;color:#fff;background:var(--c2)}
.ft.pdf{background:#b4532a}.ft.pptx{background:#c2410c}.ft.docx{background:#1d4ed8}
.fk{font-size:13px;font-weight:600;color:var(--mut);padding:0 4px}
.fb2{font-size:13px;font-weight:700;text-decoration:none;padding:6px 10px;border-radius:9px;background:var(--card);color:var(--c2);border:1px solid var(--line);transition:background .2s,color .2s}
.fb2.v{background:var(--c2);color:#fff;border-color:var(--c2)}
.fb2:hover{background:var(--c3);color:#fff;border-color:var(--c3)}
body.dark .fb2{color:var(--c4)}body.dark .fb2.v{color:#fff}

</style>

function search(){
 const q=$('#q'),r=$('#sres');if(!q)return;
 q.oninput=()=>{const s=q.value.trim().toLowerCase();if(s.length<2){r.innerHTML='';return}const h=[];
  LABS.forEach(l=>{if((tr(l.t)+' '+tr(l.d)).toLowerCase().includes(s))h.push(`<a href="lab/index.html#lab-${l.id}"><b>${esc(tr(l.t))}</b><small>${esc(T('tLab'))}</small></a>`)});
  COURSES.forEach(c=>{if((tr(c.t)+' '+tr(c.d)).toLowerCase().includes(s))h.push(`<a href="#/kurs/${c.id}"><b>${esc(tr(c.t))}</b><small>${esc(T('tCourse'))}</small></a>`);c.m.forEach(m=>{if((tr(m.t)+' '+tr(m.d||'')).toLowerCase().includes(s))h.push(`<a href="${m.u}"><b>${esc(tr(m.t))}</b><small>${esc(tr(c.t))}</small></a>`)});if(c.l)LESSONS[c.l].forEach((x,i)=>{if(Object.values(x.t).join(' ').toLowerCase().includes(s))h.push(`<a href="#/kurs/${c.id}"><b>${esc(tr(x.t))}</b><small>${esc(tr(c.t))} · ${i+1}</small></a>`)})});
  r.innerHTML=h.slice(0,24).join('')||`<a><small>${esc(T('none'))}</small></a>`};
}

function parse(src){

  for(;j<src.length;j++){const c=src[j];if(q){if(c===q)q=null;continue}if(c==='"'||c==="'"){q=c;continue}if(c==='(')d++;else if(c===')'){d--;if(!d)break}}

  if(cur.trim()||raw.includes(','))args.push(cur.trim());
  let body=null;while(src[i]===' '||src[i]==='\n')i++;

}

   case'go':p={t:'abs',x:clamp(num(c.args[0],50),0,100)/100,y:clamp(num(c.args[1],50),0,100)/100};break;
   case'speed':p={t:'fn',f:()=>R.spd=clamp(n,1,10)};break;
   case'boost':p={t:'boost'};break;case'loop':p={t:'loop'};break;
   case'orbit':p={t:'fn',f:()=>{R.mode='orbit';R.orb=Math.atan2(R.y-.78,R.x-.8)}};break;
   case'color':{const v=(c.args[0]||'white').toLowerCase();const col=COLORS[v]||(/^#[0-9a-f]{3,6}$/i.test(v)?v:null);if(!col){logl('er','color: red, blue, gold, green, white, #hex');ok=false;break}p={t:'fn',f:()=>R.col=col};break}

   case'stars':p={t:'fn',f:()=>R.starSpd=clamp(n,0,10)};break;

let burst=0;
